<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>计时器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
  }
  .timer-display {
    font-size: 5rem;
    font-weight: 200;
    letter-spacing: 4px;
    font-variant-numeric: tabular-nums;
    margin-bottom: 40px;
    color: #e0e0e0;
  }
  .timer-display .ms {
    font-size: 2.5rem;
    color: #888;
  }
  .controls {
    display: flex;
    gap: 16px;
  }
  button {
    padding: 14px 36px;
    font-size: 1.1rem;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
    min-width: 120px;
  }
  button:active { transform: scale(0.96); }
  .btn-start { background: #4caf50; color: #fff; }
  .btn-start:hover { background: #43a047; }
  .btn-pause { background: #ff9800; color: #fff; }
  .btn-pause:hover { background: #f57c00; }
  .btn-reset { background: #333; color: #ccc; }
  .btn-reset:hover { background: #444; }
  .laps {
    margin-top: 30px;
    width: 400px;
    max-height: 300px;
    overflow-y: auto;
  }
  .lap-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 16px;
    border-bottom: 1px solid #333;
    font-size: 0.95rem;
    color: #aaa;
  }
  .lap-item .lap-num { color: #666; }
  .lap-item .lap-time { font-variant-numeric: tabular-nums; }
  .btn-lap { background: #2196f3; color: #fff; }
  .btn-lap:hover { background: #1976d2; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="timer-display">
  <span id="main">00:00:00</span><span class="ms" id="ms">.000</span>
</div>

<div class="controls">
  <button class="btn-start" id="startBtn" onclick="toggleTimer()">开始</button>
  <button class="btn-lap" id="lapBtn" onclick="addLap()">计次</button>
  <button class="btn-reset" onclick="resetTimer()">重置</button>
</div>

<div class="laps" id="laps"></div>

<script>
let startTime = 0;
let elapsed = 0;
let running = false;
let rafId = null;
let lapCount = 0;
let lastLapTime = 0;

function formatTime(ms) {
  const totalMs = Math.floor(ms);
  const hours = Math.floor(totalMs / 3600000);
  const minutes = Math.floor((totalMs % 3600000) / 60000);
  const seconds = Math.floor((totalMs % 60000) / 1000);
  const milliseconds = totalMs % 1000;
  const main = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
  const msStr = `.${String(milliseconds).padStart(3,'0')}`;
  return { main, msStr };
}

function updateDisplay() {
  const now = performance.now();
  const current = elapsed + (running ? now - startTime : 0);
  const { main, msStr } = formatTime(current);
  document.getElementById('main').textContent = main;
  document.getElementById('ms').textContent = msStr;
  if (running) rafId = requestAnimationFrame(updateDisplay);
}

function toggleTimer() {
  const btn = document.getElementById('startBtn');
  if (running) {
    elapsed += performance.now() - startTime;
    running = false;
    cancelAnimationFrame(rafId);
    btn.textContent = '继续';
    btn.className = 'btn-start';
  } else {
    startTime = performance.now();
    running = true;
    btn.textContent = '暂停';
    btn.className = 'btn-pause';
    updateDisplay();
  }
}

function resetTimer() {
  running = false;
  cancelAnimationFrame(rafId);
  elapsed = 0;
  lapCount = 0;
  lastLapTime = 0;
  document.getElementById('startBtn').textContent = '开始';
  document.getElementById('startBtn').className = 'btn-start';
  document.getElementById('laps').innerHTML = '';
  updateDisplay();
}

function addLap() {
  if (!running && elapsed === 0) return;
  lapCount++;
  const current = elapsed + (running ? performance.now() - startTime : 0);
  const diff = current - lastLapTime;
  lastLapTime = current;
  const { main: totalTime } = formatTime(current);
  const { main: lapTime } = formatTime(diff);
  const lapsDiv = document.getElementById('laps');
  const item = document.createElement('div');
  item.className = 'lap-item';
  item.innerHTML = `<span class="lap-num">#${lapCount}</span><span class="lap-time">+${lapTime}</span><span class="lap-time">${totalTime}</span>`;
  lapsDiv.prepend(item);
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
  if (e.code === 'KeyL') addLap();
  if (e.code === 'KeyR') resetTimer();
});
</script>

</body>
</html>
